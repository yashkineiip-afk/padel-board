<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Падел">
<title>Падел-доска</title>
<style>
:root{--bg:#f2f4f7;--fg:#1a1d21;--btn:#fff;--bd:#cfd5dc;--on:#1f6feb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px)*0.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--fg:#eceff3;--btn:#22272d;--bd:#3a424b;--on:#4c8dff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--fg:#eceff3;--btn:#22272d;--bd:#3a424b;--on:#4c8dff;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#bar{display:flex;flex-wrap:nowrap;gap:4px;padding:4px 6px;align-items:center;height:44px;box-sizing:border-box;flex:none;position:relative;z-index:4}
#bar button{padding:6px 8px;min-height:36px;white-space:nowrap}
.gap{flex:1}
.lb{display:none}
@media (min-width:700px){.lb{display:inline}#bar{gap:6px}#bar button{padding:6px 12px}}
.dd{position:relative}
.menu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;z-index:6;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.menu.r{left:auto;right:0}
.menu[hidden]{display:none}
.menu button{text-align:left;padding:10px 12px}
.sep{width:8px}
#bar.play button:not(.keep){opacity:.4;pointer-events:none}
button{background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font:inherit;touch-action:manipulation}
button.on{background:var(--on);border-color:var(--on);color:#fff}
#wrap{flex:1;min-height:200px;position:relative;display:flex;align-items:center;justify-content:center;padding:2px}
canvas{touch-action:none;border-radius:8px;display:block}
#pn{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:5;padding:12px;box-sizing:border-box}
#pn[hidden]{display:none}
#pb{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:14px;padding:12px;width:100%;max-width:560px;max-height:85%;overflow:auto}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}
input{flex:1;min-width:0;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);-webkit-user-select:text;user-select:text}
#pmsg{font-size:13px;opacity:.8;margin-top:6px}
</style></head><body>
<div id="bar">
<button data-t="move" class="on" title="Двигать">✋<span class="lb"> Двигать</span></button>
<button data-t="erase" title="Ластик">⌫<span class="lb"> Ластик</span></button>
<div class="dd"><button id="addb">＋<span class="lb"> Добавить</span> ▾</button>
<div class="menu" id="m-add" hidden><button id="ab">🔵 Синий игрок</button><button id="ar">🔴 Красный игрок</button><button id="am">🎾 Мяч</button><button id="ac">🔺 Конус</button></div></div>
<button id="undo" title="Отмена">↶<span class="lb"> Отмена</span></button>
<span class="gap"></span>
<button id="an" class="keep">▶<span class="lb"> Анимация</span></button>
<button id="sp" class="keep">×1</button>
<div class="dd"><button id="moreb">⋯<span class="lb"> Ещё</span></button>
<div class="menu r" id="m-more" hidden><button id="cl">Стереть пути</button><button id="ca">Очистить всё</button><button id="rt">⟳ Повернуть</button><button id="pos">📁 Позиции</button></div></div>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="pn" hidden><div id="pb">
<div class="row"><b style="flex:1">Сохранённые позиции</b><button id="pc">✕</button></div>
<div class="row"><input id="pname" placeholder="Название текущей позиции"><button id="psave">💾 Сохранить</button></div>
<div id="plist"></div><div id="pmsg"></div>
</div></div>
<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;background:#b00020;color:#fff;padding:8px;border-radius:8px;font-size:13px;z-index:9';d.textContent='Ошибка: '+e.message;document.body.appendChild(d)});
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
let items=[],moves=[],hist=[],tool='move',rot=null,manual=false,W=0,H=0,R=18,drag=null,nid=1;
const COL={b:'#2f6fed',r:'#e5484d'};
function snap(){hist.push(JSON.stringify({items,moves}));if(hist.length>60)hist.shift()}
function resize(){
  const aw=Math.max(120,wrap.clientWidth-4),ah=Math.max(120,wrap.clientHeight-4);
  if(!manual)rot=aw>ah;
  const rw=rot?2:1,rh=rot?1:2,s=Math.min(aw/rw,ah/rh);
  W=Math.floor(rw*s);H=Math.floor(rh*s);
  const d=window.devicePixelRatio||1;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  R=Math.min(W,H)*0.055;
  draw();
}
const P=(u,v)=>rot?[v*W,u*H]:[u*W,v*H];
const Q=(x,y)=>rot?[y/H,x/W]:[x/W,y/H];
function poly(pts,close){ctx.beginPath();pts.forEach((p,i)=>{const[x,y]=P(p[0],p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(close)ctx.closePath()}
function figure(x,y,team,ghost){
  const dx=rot?(team==='b'?-1:1):0,dy=rot?0:(team==='b'?-1:1);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(dy,dx)+Math.PI/2);
  if(ghost)ctx.globalAlpha=0.4;
  const body=ghost?'#000':COL[team],skin=ghost?'#000':'#f1c9a5',rk=ghost?'#000':'#2b2b2b';
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(R*0.7,-R*0.1);ctx.lineTo(R*1.15,-R*0.65);
  ctx.lineWidth=3;ctx.strokeStyle=ghost?'#000':'#e8e8e8';ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle=ghost?'#000':'#fff';
  ctx.beginPath();ctx.ellipse(R*1.3,-R*0.95,R*0.38,R*0.5,0.5,0,7);ctx.fillStyle=rk;ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,R,R*0.62,0,0,7);ctx.fillStyle=body;ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-R*0.05,R*0.42,0,7);ctx.fillStyle=skin;ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle=ghost?'#000':'#6b4a2f';ctx.stroke();
  ctx.restore();
}
function ball(x,y,ghost){
  ctx.save();if(ghost)ctx.globalAlpha=0.4;
  ctx.fillStyle=ghost?'#000':'#ffd23f';ctx.strokeStyle=ghost?'#000':'#5b4a00';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,R*0.5,0,7);ctx.fill();ctx.stroke();ctx.restore();
}
function cone(x,y){
  ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.fillStyle='#e5221f';ctx.beginPath();ctx.arc(x,y,R*0.55,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff7b6b';ctx.beginPath();ctx.arc(x,y,R*0.3,0,7);ctx.fill();
  ctx.fillStyle='#8f0f0d';ctx.beginPath();ctx.arc(x,y,R*0.12,0,7);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const V=anim?animView((performance.now()-anim.t0)/1000):{items,moves},mv=V.moves,its=V.items;
  ctx.fillStyle='#2a6bb0';poly([[0,0],[1,0],[1,1],[0,1]],true);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([]);
  const a=0.5-6.95/20,b=0.5+6.95/20;
  poly([[0,a],[1,a]]);ctx.stroke();poly([[0,b],[1,b]]);ctx.stroke();
  poly([[0.5,a],[0.5,b]]);ctx.stroke();
  ctx.lineWidth=6;poly([[0,0],[1,0],[1,1],[0,1]],true);ctx.stroke();
  ctx.strokeStyle='#e8eef5';ctx.lineWidth=5;poly([[0,0.5],[1,0.5]]);ctx.stroke();
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const m of mv){
    const pts=m.pts.map(p=>P(p[0],p[1]));
    ctx.strokeStyle=m.k==='ball'?'#ffd23f':(m.team==='b'?'#a9c9ff':'#ffbcbe');
    ctx.lineWidth=3.5;ctx.setLineDash(m.k==='ball'?[]:[9,7]);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.setLineDash([]);
  }
  for(const m of mv){
    const s=P(m.pts[0][0],m.pts[0][1]);
    if(m.k!=='ball')figure(s[0],s[1],m.team,true);
  }
  for(const it of its){
    const[x,y]=P(it.u,it.v);
    it.t==='ball'?ball(x,y,mv.some(m=>m.of===it.id)):it.t==='cone'?cone(x,y):figure(x,y,it.team,false);
  }
  for(const m of mv){
    if(m.k!=='ball')continue;
    const e=P(m.pts[m.pts.length-1][0],m.pts[m.pts.length-1][1]);
    ball(e[0],e[1],mv.some(c=>c.par===m.id));
  }
}
let tt=null;
function toast(t){let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:8;max-width:90%';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{d.style.display='none'},2500)}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function hit(x,y){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i],[px,py]=P(it.u,it.v);
    if(Math.hypot(px-x,py-y)<(it.t==='ball'?R*1.0:it.t==='cone'?R*0.9:R*1.25))return it;
  }
  return null;
}
function erase(x,y){
  const it=hit(x,y);
  if(it){snap();items.splice(items.indexOf(it),1);moves=moves.filter(m=>m.of!==it.id);return}
  const be=endHit(x,y);
  if(be){rmShot(be);return}
  for(let i=moves.length-1;i>=0;i--){
    const m=moves[i],s=P(m.pts[0][0],m.pts[0][1]);
    const near=(m.k!=='ball'&&Math.hypot(s[0]-x,s[1]-y)<R*1.1)||m.pts.some(p=>{const q=P(p[0],p[1]);return Math.hypot(q[0]-x,q[1]-y)<(m.k==='ball'?R*0.9:16)});
    if(near){rmShot(m);return}
  }
}
function kids(id){return moves.filter(m=>m.par===id)}
function endHit(x,y){
  for(let i=moves.length-1;i>=0;i--){
    const m=moves[i];if(m.k!=='ball')continue;
    const e=m.pts[m.pts.length-1],q=P(e[0],e[1]);
    if(Math.hypot(q[0]-x,q[1]-y)<R)return m;
  }
  return null;
}
function startShot(it,par){
  const lvl=par?par.lvl+1:1;
  if(lvl>5){toast('Максимум 5 ударов подряд.');return false}
  const n=par?kids(par.id).length:moves.filter(m=>m.of===it.id&&m.k==='ball'&&m.par===null).length;
  if(n>=4){toast('Из этой точки уже 4 траектории. Сотрите одну ластиком или нажмите «Стереть пути».');return false}
  snap();
  const st=par?par.pts[par.pts.length-1]:[it.u,it.v];
  const m={id:nid++,of:it.id,k:'ball',par:par?par.id:null,lvl,pts:[[st[0],st[1]]]};
  moves.push(m);drag={it,m,bs:true,lq:[st[0],st[1]]};
  return true;
}
function rmShot(m){
  snap();
  const S=new Set([m.id]);let ch=true;
  while(ch){ch=false;for(const c of moves)if(c.par!=null&&S.has(c.par)&&!S.has(c.id)){S.add(c.id);ch=true}}
  moves=moves.filter(c=>!S.has(c.id));
}
cv.addEventListener('pointerdown',e=>{
  if(anim)return;
  cv.setPointerCapture(e.pointerId);
  const[x,y]=pos(e);
  if(tool==='move'){
    const bm=endHit(x,y);
    if(bm){startShot(items.find(i=>i.id===bm.of),bm);draw();return}
    const it=hit(x,y);
    if(it&&it.t==='ball'&&it.placed){startShot(it,null);draw();return}
    if(it){snap();if(it.placed&&it.t!=='cone'){const m={id:nid++,of:it.id,k:'p',team:it.team,pts:[[it.u,it.v]]};moves.push(m);drag={it,m,lq:[it.u,it.v]}}else drag={it,m:null,moved:false,x0:x,y0:y}}
  }else erase(x,y);
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const[x,y]=pos(e),q=Q(x,y),it=drag.it,m=drag.m;
  if(!m){if(!drag.moved&&Math.hypot(x-drag.x0,y-drag.y0)<=5)return;drag.moved=true}
  const cu=Math.max(-0.04,Math.min(1.04,q[0])),cw=Math.max(-0.04,Math.min(1.04,q[1]));
  if(drag.bs){drag.lq=[cu,cw];const l0=P(m.pts[m.pts.length-1][0],m.pts[m.pts.length-1][1]);if(Math.hypot(l0[0]-x,l0[1]-y)>3)m.pts.push([cu,cw]);draw();return}
  it.u=cu;it.v=cw;
  if(!m){draw();return}
  const l=P(m.pts[m.pts.length-1][0],m.pts[m.pts.length-1][1]);
  if(Math.hypot(l[0]-x,l[1]-y)>3)m.pts.push([it.u,it.v]);
  draw();
});
function up(){
  if(drag){
    const m=drag.m,it=drag.it;
    if(!m){if(drag.moved)it.placed=true;else hist.pop()}
    else if(m.pts.length<2){moves.splice(moves.indexOf(m),1);hist.pop()}
    else m.pts.push(drag.bs?drag.lq:[it.u,it.v]);
  }
  drag=null;draw();
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
});
function addP(team){
  const n=items.filter(i=>i.t==='p'&&i.team===team).length+1;if(n>4)return;
  snap();items.push({id:nid++,t:'p',team,u:[0.2,0.8,0.4,0.6][n-1],v:team==='b'?0.9:0.1});draw();
}
document.getElementById('ab').onclick=()=>addP('b');
document.getElementById('ar').onclick=()=>addP('r');
document.getElementById('am').onclick=()=>{
  snap();
  const old=items.filter(i=>i.t==='ball').map(i=>i.id);
  items=items.filter(i=>i.t!=='ball');moves=moves.filter(m=>!old.includes(m.of));
  items.push({id:nid++,t:'ball',u:0.5,v:0.6});draw();
};
document.getElementById('ac').onclick=()=>{
  const n=items.filter(i=>i.t==='cone').length;if(n>=20)return;
  snap();items.push({id:nid++,t:'cone',u:0.1+0.16*(n%6),v:0.4-0.06*Math.floor(n/6)});draw();
};
document.getElementById('undo').onclick=()=>{if(hist.length){const s=JSON.parse(hist.pop());items=s.items;moves=s.moves;draw()}};
document.getElementById('cl').onclick=()=>{snap();for(const it of items)if(it.t==='ball'){const s=moves.filter(m=>m.of===it.id);if(s.length){const p=s[s.length-1].pts[s[s.length-1].pts.length-1];it.u=p[0];it.v=p[1]}}moves=[];draw()};
document.getElementById('ca').onclick=()=>{snap();items=[];moves=[];draw()};
document.getElementById('rt').onclick=()=>{manual=true;rot=!rot;resize()};
const KEY='padel-positions-v1';let mem=null;
function getAll(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):(mem||[])}catch(e){return mem||[]}}
function putAll(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
function curState(){return JSON.parse(JSON.stringify({items,moves}))}
function twoStep(b,label,fn){
  let t=0;b.textContent=label;
  b.onclick=()=>{if(!t){b.textContent='Точно?';t=setTimeout(()=>{b.textContent=label;t=0},3000)}else{clearTimeout(t);t=0;fn()}};
}
function pmsg(t){document.getElementById('pmsg').textContent=t||''}
function renderList(){
  const a=getAll(),box=document.getElementById('plist');box.innerHTML='';
  if(!a.length){box.textContent='Пока нет сохранённых позиций.';return}
  a.forEach(p=>{
    const r=document.createElement('div');r.className='row';
    const inp=document.createElement('input');inp.value=p.name;
    inp.onchange=()=>{const all=getAll(),q=all.find(z=>z.id===p.id);if(q){q.name=inp.value.trim()||q.name;putAll(all);inp.value=q.name;pmsg('Название изменено.')}};
    const bo=document.createElement('button');bo.textContent='Открыть';bo.onclick=()=>loadPos(p.id);
    const bw=document.createElement('button');
    twoStep(bw,'Перезаписать',()=>{const all=getAll(),q=all.find(z=>z.id===p.id);if(q){q.state=curState();putAll(all);renderList();pmsg('Позиция «'+q.name+'» обновлена текущей расстановкой.')}});
    const bd=document.createElement('button');
    twoStep(bd,'✕',()=>{putAll(getAll().filter(z=>z.id!==p.id));renderList();pmsg('Позиция удалена.')});
    r.appendChild(inp);r.appendChild(bo);r.appendChild(bw);r.appendChild(bd);box.appendChild(r);
  });
}
function loadPos(id){
  const p=getAll().find(z=>z.id===id);if(!p)return;
  snap();
  items=JSON.parse(JSON.stringify(p.state.items));moves=JSON.parse(JSON.stringify(p.state.moves));
  nid=1+Math.max(0,...items.map(i=>i.id||0),...moves.map(m=>m.id||0));
  drag=null;document.getElementById('pn').hidden=true;draw();
}
document.getElementById('pos').onclick=()=>{pmsg('');renderList();document.getElementById('pn').hidden=false};
document.getElementById('pc').onclick=()=>{document.getElementById('pn').hidden=true};
document.getElementById('pn').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.hidden=true});
document.getElementById('psave').onclick=()=>{
  const a=getAll(),inp=document.getElementById('pname');
  const name=inp.value.trim()||('Позиция '+(a.length+1));
  a.push({id:Date.now()+Math.random().toString(36).slice(2,6),name,state:curState()});
  const ok=putAll(a);inp.value='';renderList();
  pmsg(ok?'Сохранено: «'+name+'».':'Память браузера недоступна: позиция сохранится только до закрытия приложения.');
};
let anim=null,mi=1;const MULT=[0.5,1,2];
function mlen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot((pts[i][0]-pts[i-1][0])*10,(pts[i][1]-pts[i-1][1])*20);return L}
function partial(pts,f){
  if(f>=1)return pts;
  const target=mlen(pts)*f;let acc=0;const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const seg=Math.hypot((pts[i][0]-pts[i-1][0])*10,(pts[i][1]-pts[i-1][1])*20);
    if(acc+seg>=target){const k=seg?(target-acc)/seg:0;out.push([pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k]);return out}
    acc+=seg;out.push(pts[i]);
  }
  return out;
}
function schedule(mult){
  let t=0;const list=[];
  for(const m of moves){const d=Math.max(0.6,mlen(m.pts)/(m.k==='ball'?5:1.5))/mult;list.push({m,s:t,d});t+=d+0.5/mult}
  return {list,total:t};
}
function animView(t){
  const vm=[],last={};
  for(const e of anim.list){
    if(t<e.s)continue;
    const pts=partial(e.m.pts,Math.min(1,(t-e.s)/e.d));
    vm.push(Object.assign({},e.m,{pts}));last[e.m.of]=pts[pts.length-1];
  }
  const vi=items.map(it=>{
    if(it.t!=='p')return it;
    if(last[it.id])return Object.assign({},it,{u:last[it.id][0],v:last[it.id][1]});
    const f=moves.find(m=>m.of===it.id);
    return f?Object.assign({},it,{u:f.pts[0][0],v:f.pts[0][1]}):it;
  });
  return {items:vi,moves:vm};
}
function setBtn(){document.getElementById('an').innerHTML=(anim?'■':'▶')+'<span class="lb"> '+(anim?'Стоп':'Анимация')+'</span>';document.getElementById('sp').innerHTML='<span class="lb">Скорость </span>×'+MULT[mi]}
function tick(){
  if(!anim)return;
  const t=(performance.now()-anim.t0)/1000;
  draw();
  if(t>anim.total+0.4){stopAnim();return}
  requestAnimationFrame(tick);
}
function startAnim(){
  if(!moves.length){toast('Сначала проведите игроков и мяч, чтобы было что проигрывать.');return}
  const sc=schedule(MULT[mi]);
  anim={list:sc.list,total:sc.total,t0:performance.now()};
  document.getElementById('bar').classList.add('play');setBtn();tick();
}
function stopAnim(){anim=null;document.getElementById('bar').classList.remove('play');setBtn();draw()}
document.getElementById('an').onclick=()=>{anim?stopAnim():startAnim()};
document.getElementById('sp').onclick=()=>{mi=(mi+1)%MULT.length;setBtn();if(anim)startAnim()};
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>{m.hidden=true})}
function toggleMenu(id){const m=document.getElementById(id),open=m.hidden;closeMenus();m.hidden=!open}
document.getElementById('addb').onclick=()=>toggleMenu('m-add');
document.getElementById('moreb').onclick=()=>toggleMenu('m-more');
document.querySelectorAll('.menu').forEach(m=>m.addEventListener('click',()=>closeMenus()));
document.addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('.dd')))closeMenus()});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(wrap);
setTimeout(resize,300);setTimeout(resize,1000);
resize();
</script></body></html>
