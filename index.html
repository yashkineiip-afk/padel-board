<style>

.card,.mbox,.f{max-width:100%;box-sizing:border-box;min-width:0}

.stp{display:flex;align-items:center;gap:6px}.stp button{padding:6px 12px;min-width:38px}.stp b{min-width:22px;text-align:center}
textarea,select{font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);-webkit-user-select:text;user-select:text}

button.big{width:100%;padding:12px;font-weight:600;margin-top:6px}

<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;background:#b00020;color:#fff;padding:8px;border-radius:8px;font-size:13px;z-index:9';d.textContent='Ошибка: '+e.message;document.body.appendChild(d)});
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
let view3d=false,items=[],moves=[],hist=[],tool='move',rot=null,manual=false,W=0,H=0,R=18,drag=null,nid=1;
const COL={b:'#2f6fed',r:'#e5484d'};
function snap(){hist.push(JSON.stringify({items,moves}));if(hist.length>60)hist.shift()}
function resize(){
  const aw=Math.max(120,wrap.clientWidth-4),ah=Math.max(120,wrap.clientHeight-4);
  if(!manual)rot=aw>ah;
  const rw=rot?2:1,rh=rot?1:2,s=Math.min(aw/rw,ah/rh);
  if(view3d){W=Math.floor(aw);H=Math.floor(ah)}else{W=Math.floor(rw*s);H=Math.floor(rh*s)}
  const d=window.devicePixelRatio||1;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  R=Math.min(W,H)*0.055;
  draw();
}
const P=(u,v)=>rot?[v*W,u*H]:[u*W,v*H];
const Q=(x,y)=>rot?[y/H,x/W]:[x/W,y/H];
function poly(pts,close){ctx.beginPath();pts.forEach((p,i)=>{const[x,y]=P(p[0],p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(close)ctx.closePath()}
function figure(x,y,team,ghost,ga){
  const k=ga===undefined?1:ga,dx=rot?(team==='b'?-1:1):0,dy=rot?0:(team==='b'?-1:1);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(dy,dx)+Math.PI/2);
  if(ghost){
    ctx.globalAlpha=0.34*k;ctx.fillStyle='#dfe6f5';
    ctx.beginPath();ctx.ellipse(0,0,R,R*0.62,0,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(0,-R*0.05,R*0.42,0,7);ctx.fill();
    ctx.beginPath();
    if(team==='c')ctx.ellipse(-R*1.3,-R*0.65,R*0.55,R*0.45,0,0,7);else ctx.ellipse(R*1.4,-R*1.1,R*0.4,R*0.5,0.45,0,7);
    ctx.fill();ctx.restore();return;
  }
  const T={b:['#8fb4ff','#2f6fed','#16358f'],r:['#ff9a9d','#e5484d','#8f1b20'],c:['#555566','#1a1a22','#050507']}[team]||['#8fb4ff','#2f6fed','#16358f'];
  const lt=T[0],bs=T[1],dk=T[2];
  ctx.lineCap='round';
  // racket (or ball basket for the coach) with a soft drop shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=R*0.4;ctx.shadowOffsetX=R*0.14;ctx.shadowOffsetY=R*0.24;
  if(team==='c'){
    ctx.beginPath();ctx.moveTo(-R*0.9,-R*0.3);ctx.lineTo(-R*1.1,-R*0.5);ctx.lineWidth=R*0.2;ctx.strokeStyle='#1a1a22';ctx.stroke();
    const bg=ctx.createRadialGradient(-R*1.5,-R*0.85,R*0.05,-R*1.35,-R*0.7,R*0.7);
    bg.addColorStop(0,'#ffcf7a');bg.addColorStop(0.55,'#d98a1f');bg.addColorStop(1,'#7a4308');
    ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(-R*1.35,-R*0.7,R*0.6,R*0.5,0,0,7);ctx.fill();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#4a2a05';ctx.beginPath();ctx.ellipse(-R*1.35,-R*0.7,R*0.42,R*0.33,0,0,7);ctx.fill();
    for(const q of [[-1.5,-0.82],[-1.2,-0.84],[-1.34,-0.56],[-1.5,-0.58]]){
      const bl=ctx.createRadialGradient(R*q[0]-R*0.04,R*q[1]-R*0.05,R*0.01,R*q[0],R*q[1],R*0.15);
      bl.addColorStop(0,'#fbffc4');bl.addColorStop(1,'#a8d800');
      ctx.fillStyle=bl;ctx.beginPath();ctx.arc(R*q[0],R*q[1],R*0.14,0,7);ctx.fill();
    }
  }else{
    ctx.beginPath();ctx.moveTo(R*0.98,-R*0.35);ctx.lineTo(R*1.2,-R*0.78);ctx.lineWidth=R*0.13;ctx.strokeStyle='#d6d6de';ctx.stroke();
    ctx.save();ctx.translate(R*1.4,-R*1.1);ctx.rotate(0.45);
    const rg=ctx.createLinearGradient(-R*0.4,-R*0.5,R*0.4,R*0.5);
    rg.addColorStop(0,'#3b3b48');rg.addColorStop(1,'#101016');
    ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(0,0,R*0.4,R*0.5,0,0,7);ctx.fill();
    ctx.shadowColor=bs;ctx.shadowBlur=R*0.35;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
    ctx.strokeStyle=lt;ctx.lineWidth=3;ctx.stroke();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.3)';
    for(const i of [-1,0,1])for(const j of [-1,0,1]){if(i*i+j*j*0.7>1.6)continue;ctx.beginPath();ctx.arc(i*R*0.15,j*R*0.17,R*0.045,0,7);ctx.fill()}
    ctx.restore();
  }
  ctx.restore();
  // arms
  ctx.fillStyle=dk;
  ctx.beginPath();ctx.ellipse(-R*0.93,-R*0.12,R*0.27,R*0.42,0.12,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(R*0.93,-R*0.12,R*0.27,R*0.42,-0.12,0,7);ctx.fill();
  ctx.fillStyle='#e8b98f';
  ctx.beginPath();ctx.arc(-R*1.0,-R*0.5,R*0.14,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(R*1.0,-R*0.5,R*0.14,0,7);ctx.fill();
  // shoulders: shaded body with a neon rim
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.65)';ctx.shadowBlur=R*0.45;ctx.shadowOffsetX=R*0.14;ctx.shadowOffsetY=R*0.26;
  const sg=ctx.createRadialGradient(-R*0.3,-R*0.25,R*0.1,0,0,R*1.1);
  sg.addColorStop(0,lt);sg.addColorStop(0.5,bs);sg.addColorStop(1,dk);
  ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(0,0,R,R*0.62,0,0,7);ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.stroke();
  ctx.restore();
  // shirt stripe, then head with hair and a cap visor
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,R*0.06,R*0.78,R*0.4,0,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
  const hg=ctx.createRadialGradient(-R*0.12,-R*0.18,R*0.04,0,-R*0.05,R*0.45);
  hg.addColorStop(0,'#5a4636');hg.addColorStop(1,'#1c130c');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-R*0.05,R*0.42,0,7);ctx.fill();
  ctx.fillStyle=team==='c'?'#fff':lt;ctx.beginPath();ctx.ellipse(0,-R*0.4,R*0.3,R*0.13,0,0,Math.PI);ctx.fill();
  ctx.restore();
}
function bR(){return Math.max(5.6,Math.min(W,H)/10*0.17)}
function ball(x,y,ghost,ga){
  const k=ga===undefined?1:ga,rb=bR();ctx.save();
  if(ghost){ctx.globalAlpha=0.4*k;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,y,rb,0,7);ctx.fill();ctx.restore();return}
  ctx.globalAlpha=k;
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=rb*0.9;ctx.shadowOffsetX=rb*0.3;ctx.shadowOffsetY=rb*0.5;
  const g=ctx.createRadialGradient(x-rb*0.34,y-rb*0.4,rb*0.08,x,y,rb*1.1);
  g.addColorStop(0,'#fff3b0');g.addColorStop(0.45,'#ffd23f');g.addColorStop(1,'#a07d00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rb,0,7);ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  if(rb>=5){
    ctx.beginPath();ctx.arc(x,y,rb,0,7);ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=Math.max(1,rb*0.14);
    ctx.beginPath();ctx.arc(x-rb*1.24,y,rb,-0.9,0.9);ctx.stroke();
    ctx.beginPath();ctx.arc(x+rb*1.24,y,rb,Math.PI-0.9,Math.PI+0.9);ctx.stroke();
  }
  ctx.restore();
}
function cone(x,y){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.75)';ctx.shadowBlur=R*0.4;ctx.shadowOffsetX=R*0.12;ctx.shadowOffsetY=R*0.2;
  ctx.fillStyle='#9d0c1a';ctx.fillRect(x-R*0.5,y-R*0.5,R,R);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  const g=ctx.createRadialGradient(x-R*0.12,y-R*0.14,R*0.03,x,y,R*0.46);
  g.addColorStop(0,'#ffb3ae');g.addColorStop(0.45,'#ff3347');g.addColorStop(1,'#a20b1b');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*0.44,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,R*0.27,0,7);ctx.stroke();
  ctx.fillStyle='#ffd8d4';ctx.beginPath();ctx.arc(x-R*0.05,y-R*0.06,R*0.08,0,7);ctx.fill();
  ctx.restore();
}
function drawCourt2D(){
  const full=[[0,0],[1,0],[1,1],[0,1]];
  ctx.fillStyle='#2a6bb0';poly(full,true);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let k=0;k<20;k+=2){poly([[0,k/20],[1,k/20],[1,(k+1)/20],[0,(k+1)/20]],true);ctx.fill()}
  const a=0.5-6.95/20,b=0.5+6.95/20;
  ctx.save();ctx.lineCap='round';ctx.setLineDash([]);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  poly([[0,a],[1,a]]);ctx.stroke();poly([[0,b],[1,b]]);ctx.stroke();poly([[0.5,a],[0.5,b]]);ctx.stroke();
  ctx.lineWidth=6;poly(full,true);ctx.stroke();
  ctx.restore();
  const A=P(0,0.5),B=P(1,0.5);
  ctx.save();ctx.lineCap='butt';

function autoRevise(st,silent){

  const sp=st.strat,prev=sp.rev||null;

  if(bandChanged){sp.ov={};p=stratPlan(st)}
  if(sp.days==null)sp.days=kidOf(st)?3:4;
  const kid=kidOf(st),pl=st.plan;
  pl.items=pl.items.filter(i=>!(i.auto&&!i.done));

    const mk=t=>({id:uid(),text:t,done:false,auto:true}),list=[];
    list.push(mk(kid?'Разминка-игра (10 мин)':'Разминка и мобильность (10 мин)'));

    list.push(mk(kid?'Итоги: что получилось и что понравилось (5 мин)':'Итоги и задание на неделю (5 мин)'));
    pl.items=list.concat(pl.items);

    const cc=p.getContext('2d');cc.fillStyle='#e3e6ee';cc.fillRect(PM,PH-96,PW-2*PM,2);
    cc.font='22px '+FONT;cc.fillStyle='#6b7080';cc.textBaseline='alphabetic';cc.textAlign='left';cc.fillText('Тренер: '+coach+(co.contact?' · '+co.contact:''),PM,PH-52);
    cc.textAlign='right';cc.fillText((i+1)+' / '+pages.length,PW-PM,PH-52);cc.textAlign='left';
  });
  return pages;
}
function buildPdf(pages,title){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=u=>{chunks.push(u);len+=u.length},str=s=>push(enc.encode(s));
  const hex=s=>{let h='FEFF';for(let i=0;i<s.length;i++)h+=s.charCodeAt(i).toString(16).padStart(4,'0');return '<'+h.toUpperCase()+'>'};
  const n=pages.length,total=3+n*3;
  str('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
  const obj=(id,body)=>{offs[id]=len;str(id+' 0 obj\n'+body+'\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Count '+n+' /Kids ['+pages.map((_,i)=>(4+i*3)+' 0 R').join(' ')+'] >>');
  obj(3,'<< /Title '+hex(title)+' /Producer (Padel board) >>');
  pages.forEach((cv2,i)=>{
    const pid=4+i*3,cid=5+i*3,iid=6+i*3;
    const b64=cv2.toDataURL('image/jpeg',0.92).split(',')[1],bin=atob(b64),jpg=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');
    const cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(cid,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[iid]=len;str(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv2.width+' /Height '+cv2.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
    push(jpg);str('\nendstream\nendobj\n');
  });
  const xr=len;str('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=total;i++)str(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  str('trailer\n<< /Size '+(total+1)+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  const out=new Uint8Array(len);let p=0;for(const u of chunks){out.set(u,p);p+=u.length}
  return out;
}
async function exportPdf(st){
  try{
    toast('Готовлю PDF…');
    const pages=pdfPages(st),bytes=buildPdf(pages,'Портрет игрока — '+(st.name||'ученик'));
    const blob=new Blob([bytes],{type:'application/pdf'}),name=('Портрет - '+(st.name||'ученик')).replace(/[\\/:*?"<>|]/g,'')+'.pdf';
    let f=null;try{f=new File([blob],name,{type:'application/pdf'})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:name});return bytes}catch(e){if(e&&e.name==='AbortError')return bytes}
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url)}catch(e){}},5000);
    toast('PDF сохранён. Если загрузки нет, откройте доску в Safari или Chrome.');
    return bytes;
  }catch(e){toast('Не удалось собрать PDF: '+(e&&e.message||e));return null}
}

const NAMES=['Oksana','Evgenii'];
let memUsers={},sel=null;

// ===== Резервная копия данных кабинета =====
async function backupSave(){
  try{
    const data={app:'padel-board',v:1,date:new Date().toISOString(),cabinet:user,positions:getAll(),students:getSt(),coach:getCoach()};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),name='padel-copy-'+(user||'cabinet')+'-'+today()+'.json';
    let f=null;try{f=new File([blob],name,{type:'application/json'})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:name});toast('Копия готова.');return}catch(e){if(e&&e.name==='AbortError')return}
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url)}catch(e){}},5000);
    toast('Копия сохранена в файл '+name);
  }catch(e){toast('Не удалось сохранить копию: '+(e&&e.message||e))}
}
function backupApply(d,replace){
  let np=0,ns=0;
  const ps=Array.isArray(d.positions)?d.positions:[],sts=Array.isArray(d.students)?d.students:[],co=(d.coach&&typeof d.coach==='object')?d.coach:{};
  if(replace){putAll(ps);putSt(sts);putCoach(co);np=ps.length;ns=sts.length}
  else{
    const ap=getAll(),ids=new Set(ap.map(p=>p.id));
    ps.forEach(p=>{if(p&&!ids.has(p.id)){ap.push(p);np++}});putAll(ap);
    const as=getSt(),sid=new Set(as.map(x=>x.id));
    sts.forEach(x=>{if(x&&!sid.has(x.id)){as.push(x);ns++}});putSt(as);
    const cur=getCoach();Object.keys(co).forEach(k=>{if(!cur[k]&&co[k])cur[k]=co[k]});putCoach(cur);
  }
  return {np,ns};
}
function backupMenu(){
  openModal((bx,close)=>{
    bx.appendChild(ce('div',{style:'font-weight:700;font-size:17px;margin-bottom:6px',text:'💾 Копия данных кабинета'}));
    bx.appendChild(ce('div',{className:'muted',text:'В копию входят ученики, сохранённые позиции и данные тренера этого кабинета ('+(user||'')+'). Пароли в файл не попадают.'}));
    bx.appendChild(ce('button',{className:'big',style:'margin-top:10px',text:'Сохранить копию в файл',onclick:()=>{backupSave()}}));
    const msg=ce('div',{className:'muted',style:'margin-top:8px'});
    const inp=ce('input',{type:'file',accept:'.json,application/json',style:'display:none'});
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        let d=null;try{d=JSON.parse(rd.result)}catch(e){}
        if(!d||d.app!=='padel-board'){msg.textContent='Это не файл копии падел-доски.';return}
        msg.textContent='';
        const np=(d.positions||[]).length,ns=(d.students||[]).length;
        bx.textContent='';
        bx.appendChild(ce('div',{style:'font-weight:700;font-size:17px;margin-bottom:6px',text:'Загрузить копию'}));
        bx.appendChild(ce('div',{text:'В файле: учеников — '+ns+', позиций — '+np+(d.cabinet?' (кабинет '+d.cabinet+')':'')+'.'}));
        bx.appendChild(ce('button',{className:'big',style:'margin-top:10px',text:'Добавить к текущим (ничего не удаляется)',onclick:()=>{const r=backupApply(d,false);close();toast('Добавлено: учеников — '+r.ns+', позиций — '+r.np+'.')}}));
        const rp=ce('button',{style:'margin-top:8px'});twoStep(rp,'Заменить текущие данные',()=>{const r=backupApply(d,true);close();toast('Загружено: учеников — '+r.ns+', позиций — '+r.np+'.')});
        bx.appendChild(rp);
        bx.appendChild(ce('button',{style:'margin-top:8px',text:'Отмена',onclick:close}));
      };
      rd.onerror=()=>{msg.textContent='Не удалось прочитать файл.'};
      rd.readAsText(f);
    };
    bx.appendChild(ce('button',{style:'margin-top:8px',text:'Загрузить копию из файла',onclick:()=>inp.click()}));
    bx.appendChild(inp);bx.appendChild(msg);
    bx.appendChild(ce('button',{style:'margin-top:8px',text:'Закрыть',onclick:close}));
  });
}
document.getElementById('bk').onclick=backupMenu;
function getUsers(){try{return JSON.parse(localStorage.getItem('padel-users-v1')||'{}')}catch(e){return memUsers}}
function saveUsers(u){memUsers=u;try{localStorage.setItem('padel-users-v1',JSON.stringify(u))}catch(e){}}
async function hashPw(n,p){
  const str='padel|'+n+'|'+p;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16)}
}
function amsg(t){document.getElementById('au-msg').textContent=t||''}
function pick(n){
  sel=n;
  ['au-u1','au-u2'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',NAMES[i]===n));
  const reg=!getUsers()[n];
  document.getElementById('au-pw2').hidden=!reg;
  document.getElementById('au-go').textContent=reg?'Зарегистрироваться':'Войти';
  amsg(reg?'Первый вход: придумайте пароль (не короче 4 символов) и повторите его.':'Введите пароль.');
}
async function authGo(){
  if(!sel||!NAMES.includes(sel)){amsg('Сначала выберите имя.');return}
  const pw=document.getElementById('au-pw').value,users=getUsers();
  if(!users[sel]){
    if(pw.length<4){amsg('Пароль должен быть не короче 4 символов.');return}
    if(pw!==document.getElementById('au-pw2').value){amsg('Пароли не совпадают.');return}
    users[sel]={h:await hashPw(sel,pw)};saveUsers(users);
  }else if(await hashPw(sel,pw)!==users[sel].h){amsg('Неверный пароль.');return}
  login(sel);
}
function login(n){
  user=n;mem=null;
  try{localStorage.setItem('padel-session-v1',n)}catch(e){}
  try{const old=localStorage.getItem('padel-positions-v1');if(old&&!localStorage.getItem('padel-legacy-claimed')&&!localStorage.getItem(pk())){localStorage.setItem(pk(),old);localStorage.setItem('padel-legacy-claimed',n)}}catch(e){}
  items=[];moves=[];hist=[];drag=null;setTool('move');stReset();seedBoard();
  document.getElementById('who').textContent='👤 '+n+' · версия 17.11';
  document.getElementById('ptitle').textContent='Позиции: '+n;
  document.getElementById('au-pw').value='';document.getElementById('au-pw2').value='';
  document.getElementById('au').hidden=true;draw();try{stBadge()}catch(e){}
}
function logout(){
  if(anim)stopAnim();
  try{localStorage.removeItem('padel-session-v1')}catch(e){}
  user=null;mem=null;sel=null;items=[];moves=[];hist=[];drag=null;stReset();
  document.getElementById('au-u1').classList.remove('on');document.getElementById('au-u2').classList.remove('on');
  document.getElementById('au-pw').value='';document.getElementById('au-pw2').value='';
  document.getElementById('au-pw2').hidden=true;document.getElementById('au-go').textContent='Продолжить';
  amsg('Выберите имя.');document.getElementById('pn').hidden=true;document.getElementById('au').hidden=false;draw();
}
document.getElementById('au-u1').onclick=()=>pick(NAMES[0]);
document.getElementById('au-u2').onclick=()=>pick(NAMES[1]);
document.getElementById('au-go').onclick=authGo;
document.getElementById('lo').onclick=logout;
document.getElementById('au-pw').addEventListener('keydown',e=>{if(e.key==='Enter')authGo()});
document.getElementById('au-pw2').addEventListener('keydown',e=>{if(e.key==='Enter')authGo()});
(function initAuth(){
  let n=null;try{n=localStorage.getItem('padel-session-v1')}catch(e){}
  if(n&&NAMES.includes(n)&&getUsers()[n]){login(n);return}
  logout();
})();
